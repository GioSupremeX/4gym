services:
  - type: web
    name: hellenic-heritage
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hellenic-heritage-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: hellenic-heritage-db
    plan: free
